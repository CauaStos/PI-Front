services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onstage}
      POSTGRES_USER: ${POSTGRES_USER:-onstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onstage}
    ports:
      - "5433:5432"
    volumes:
      - onstage-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onstage}:${POSTGRES_PASSWORD:-onstage}@db:5432/${POSTGRES_DB:-onstage}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  onstage-postgres:
