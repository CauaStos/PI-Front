services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onstage}
      POSTGRES_USER: ${POSTGRES_USER:-onstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onstage}
    ports:
      - "5433:5432"
    volumes:
      - onstage-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: oven/bun:1.3.14
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-onstage}:${POSTGRES_PASSWORD:-onstage}@db:5432/${POSTGRES_DB:-onstage}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app-dev-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  onstage-postgres:
  app-dev-node-modules:
